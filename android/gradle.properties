# Keep heap modest: C: is often near full and large dumps fail the build.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The project (D:) and the pub cache (C:) are on different drives, which breaks
# Kotlin incremental caches for plugins compiled from the pub cache.
kotlin.incremental=false
# Prefer project build dir on D: (already the case); avoid filling C: with workers.
org.gradle.parallel=true
org.gradle.caching=true
